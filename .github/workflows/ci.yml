name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, migrations, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveltrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d traveltrace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e "backend[dev]"

      - name: Lint and format check
        run: |
          ruff check backend tests
          ruff format --check backend tests

      - name: Apply migrations to PostgreSQL + PostGIS
        env:
          TRAVELTRACE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/traveltrace_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run tests (SQLite + PostGIS integration)
        env:
          TRAVELTRACE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/traveltrace_test
        run: pytest

  frontend:
    name: Frontend · lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: pip install -e "backend[dev]"

      - name: Start API
        env:
          TRAVELTRACE_ENVIRONMENT: test
          TRAVELTRACE_DATABASE_URL: sqlite:///${{ github.workspace }}/backend/data/e2e.db
          TRAVELTRACE_STORAGE_DIR: ${{ github.workspace }}/backend/data/e2e-uploads
          TRAVELTRACE_TASK_BACKEND: inline
          TRAVELTRACE_SECRET_KEY: e2e-ci-secret-not-for-production
        run: |
          mkdir -p backend/data
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null; then
              echo "API ready"; break
            fi
            sleep 1
          done

      - name: Install frontend and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Serve the production build
        working-directory: frontend
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Preview ready"; break
            fi
            sleep 1
          done

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    name: Docker · build and one-command deployment
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Compose file
        run: docker compose config -q

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the deployment
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health; then
              echo "Stack is healthy"; exit 0
            fi
            sleep 3
          done
          echo "Stack did not become healthy" >&2
          exit 1

      - name: Show service status
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
