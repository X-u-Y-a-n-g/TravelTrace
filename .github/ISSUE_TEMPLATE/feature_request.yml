name: Feature request
description: Suggest a capability or improvement.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour you would like, including alternatives.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Trips
        - Photos / import
        - Map
        - Timeline
        - Places
        - Memory book / export
        - Privacy / security
        - Deployment
        - Developer experience
        - Other
  - type: checkboxes
    id: roadmap
    attributes:
      label: Roadmap
      options:
        - label: I checked the roadmap in README.md; this is not already planned
