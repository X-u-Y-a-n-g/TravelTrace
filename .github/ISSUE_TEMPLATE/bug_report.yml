name: Bug report
description: Report something that is broken or behaves unexpectedly.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security issues please use the private advisory flow
        described in SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a trip…
        2. Upload a photo with GPS…
        3. Open the map…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0 or a commit hash
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Local development (SQLite)
        - Local development (PostgreSQL)
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS / Python / Node
      placeholder: Chrome 130 on Windows 11, Python 3.12, Node 22
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Browser console, backend logs or import task errors.
      render: shell
