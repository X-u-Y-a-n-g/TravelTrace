[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "traveltrace-backend"
version = "0.1.0"
description = "TravelTrace API — your journey, reconstructed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "XuYang" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12",
  "Pillow>=10.4,<12",
  "PyJWT>=2.9,<3",
  "bcrypt>=4.2,<5",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "geoalchemy2>=0.15,<1",
  "email-validator>=2.2,<3",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.7,<1",
]
worker = [
  "celery[redis]>=5.4,<6",
  "redis>=5.1,<6",
]

[tool.setuptools.packages.find]
include = ["app*"]
